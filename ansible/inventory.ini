[primary]
hana-primary ansible_host=<primary-public-ip> ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/<your-key-pair-name>.pem

[secondary]
hana-secondary ansible_host=<secondary-public-ip> ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/<your-key-pair-name>.pem

[hana:children]
primary
secondary

[hana:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=20'
